server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_connect_timeout 5s;
        proxy_read_timeout 40s;
        proxy_set_header Host $host;
        client_max_body_size 64k;
    }
    location / { try_files $uri $uri/ /index.html; }
}
