spring.application.name=demo
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/git_health_monitor}
spring.datasource.username=${DB_USERNAME:ghm}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
app.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
# Enable only for a controlled prototype session until authentication is added.
app.registration-enabled=${APP_REGISTRATION_ENABLED:false}
# Enable only in a controlled environment after an AnalysisPipeline adapter is installed.
app.analysis.enabled=${APP_ANALYSIS_ENABLED:false}
app.analysis.writes-enabled=${APP_ANALYSIS_WRITES_ENABLED:false}
app.analysis.pipeline.enabled=${APP_ANALYSIS_PIPELINE_ENABLED:false}
app.analysis.cache-dir=${APP_ANALYSIS_CACHE_DIR:target/git-analysis-cache}
app.ai-review.enabled=${APP_AI_REVIEW_ENABLED:false}
# Opt-in real LLM provider adapter (requires APP_AI_REVIEW_PROVIDER_ENABLED=true and non-empty API key).
app.ai-review.provider.enabled=${APP_AI_REVIEW_PROVIDER_ENABLED:false}
app.ai-review.provider.name=${APP_AI_REVIEW_PROVIDER_NAME:mistral}
app.ai-review.provider.endpoint=${APP_AI_REVIEW_PROVIDER_ENDPOINT:https://api.mistral.ai/v1/chat/completions}
app.ai-review.provider.model=${APP_AI_REVIEW_PROVIDER_MODEL:codestral-latest}
app.ai-review.provider.api-key=${APP_AI_REVIEW_PROVIDER_API_KEY:}
app.ai-review.provider.max-input-tokens=${APP_AI_REVIEW_PROVIDER_MAX_INPUT_TOKENS:16384}
app.ai-review.provider.max-output-tokens=${APP_AI_REVIEW_PROVIDER_MAX_OUTPUT_TOKENS:2048}
