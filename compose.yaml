services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-git_health_monitor}
      POSTGRES_USER: ${DB_USERNAME:-ghm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-git_health_monitor}
      DB_USERNAME: ${DB_USERNAME:-ghm}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      APP_REGISTRATION_ENABLED: "true"
      APP_ANALYSIS_ENABLED: ${APP_ANALYSIS_ENABLED:-true}
      APP_ANALYSIS_WRITES_ENABLED: ${APP_ANALYSIS_WRITES_ENABLED:-true}
      APP_ANALYSIS_PIPELINE_ENABLED: ${APP_ANALYSIS_PIPELINE_ENABLED:-true}
      APP_ANALYSIS_CACHE_DIR: /app/cache
      APP_AI_REVIEW_ENABLED: ${APP_AI_REVIEW_ENABLED:-false}
      APP_AI_REVIEW_PROVIDER_ENABLED: ${APP_AI_REVIEW_PROVIDER_ENABLED:-false}
      APP_AI_REVIEW_PROVIDER_NAME: ${APP_AI_REVIEW_PROVIDER_NAME:-mistral}
      APP_AI_REVIEW_PROVIDER_ENDPOINT: ${APP_AI_REVIEW_PROVIDER_ENDPOINT:-https://api.mistral.ai/v1/chat/completions}
      APP_AI_REVIEW_PROVIDER_MODEL: ${APP_AI_REVIEW_PROVIDER_MODEL:-codestral-latest}
      APP_AI_REVIEW_PROVIDER_API_KEY: ${APP_AI_REVIEW_PROVIDER_API_KEY:-}
      APP_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - gitcache:/app/cache
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
volumes:
  pgdata:
  gitcache:
